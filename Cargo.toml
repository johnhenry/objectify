[package]
name = "objectify"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "objectify"
path = "src/main.rs"

[dependencies]
clap            = { version = "4", features = ["derive"] }
rusqlite        = { version = "0.31", features = ["bundled"] }
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
jsonschema      = "0.18"
json-patch      = "1"
rand            = "0.9"
chrono          = { version = "0.4", features = ["serde"] }
thiserror       = "1"
anyhow          = "1"
which           = "6"
tempfile        = "3"
dirs            = "5"

[profile.release]
strip = true
opt-level = 3
