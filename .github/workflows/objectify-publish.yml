name: objectify Publish

# Publish @johnhenry/objectify (the TypeScript adapter, packages/objectify) from main with
# Changesets (fleet publish model: main is the release branch, see johnhenry/workflows'
# README).
#
# On every push to main this workflow either (a) opens/updates the "chore: version
# packages" PR that applies pending changesets, or (b) when that PR has just been merged,
# runs `npm run release` (build + `changeset publish`, which skips versions already on
# npm) and, as a by-product, changesets/action pushes the tag and creates a GitHub
# Release for what was published. A push with no pending bump publishes nothing.
#
# The CLI + platform packages (npm/*) are published by release.yml, not here. This file is
# the npm trusted-publisher entry point for @johnhenry/objectify -- do not rename it.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # version-bump commit, tags, GitHub Releases
  pull-requests: write # the "Version Packages" PR
  id-token: write # npm provenance / trusted publishing (Sigstore build attestation)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets diffs against the base branch

      - uses: actions/setup-node@v4
        with:
          node-version: 26 # must equal engines.node major
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build --workspace @johnhenry/objectify

      - name: Test (full gate before publish)
        run: npm test --workspace @johnhenry/objectify

      - name: Version PR or publish
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version-packages
          title: "chore: version packages"
          commit: "chore: version packages"
          # createGithubReleases defaults to true: a tag + Release per published package.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
